name: cascade
on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  cascade:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record cascade hop
        run: |
          mkdir -p docs
          echo "# Cascade hop" > docs/CASCADE-HOP.md
          echo "event=${{ github.event_name }} run=${{ github.run_id }} numeral=137451921129154222 stage=98" >> docs/CASCADE-HOP.md
          echo "next=nexus-repo-sync NEXUS-SENTINEL-LEDGER" >> docs/CASCADE-HOP.md
          git config user.name "continuity-engine"
          git config user.email "continuity@users.noreply.github.com"
          git add docs/CASCADE-HOP.md
          git diff --cached --quiet || git commit -m "chore(cascade): hop after ${{ github.event_name }} ${{ github.run_id }}"
          git push || true
