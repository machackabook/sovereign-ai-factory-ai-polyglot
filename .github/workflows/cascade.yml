name: cascade
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cascade:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record cascade hop
        run: |
          mkdir -p docs
          echo "# Cascade hop" > docs/CASCADE-HOP.md
          echo "event=${{ github.event_name }} run=${{ github.run_id }} numeral=137451921129154222" >> docs/CASCADE-HOP.md
          echo "next=Cryptic-Heartbeat The-Hive gaia-visualizer nexus-repo-sync" >> docs/CASCADE-HOP.md
          git config user.name "continuity-engine"
          git config user.email "continuity@users.noreply.github.com"
          git add docs/CASCADE-HOP.md
          git diff --cached --quiet || git commit -m "chore(cascade): hop after pull ${{ github.run_id }}"
          git push || true
