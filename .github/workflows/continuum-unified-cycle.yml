name: continuum-unified-cycle
# Continuity Engine — Unified GitHub ↔ Drive ↔ Grok ↔ Gemini cycle
# Numeral: 137451921129154222

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [gemini-message, grok-message, drive-scan, bus-ping]
  push:
    paths:
      - 'bus/**'
      - 'docs/4_STAGE_ALPHA_GIG_CATALOG.md'
      - 'docs/MULTI_PASS_DRIVE_SCAN_CATALOG.md'

permissions:
  contents: write
  issues: write

jobs:
  unified-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure bus + ledger structure
        run: |
          mkdir -p bus/inbox bus/outbox bus/gemini bus/grok docs/ledgers scripts
          echo "numeral=137451921129154222" > bus/IDENTITY.md
          echo "participants=github,grok,gemini,drive" >> bus/IDENTITY.md
          echo "mode=bidirectional-open-message-bus" >> bus/IDENTITY.md

      - name: Stamp cycle heartbeat
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"ts\":\"$TS\",\"event\":\"unified-cycle\",\"numeral\":\"137451921129154222\",\"run\":\"${{ github.run_id }}\"}" >> docs/ledgers/unified-cycle.jsonl

      - name: Process message bus
        run: |
          if ls bus/inbox/*.json 1>/dev/null 2>&1; then
            for f in bus/inbox/*.json; do
              base=$(basename "$f")
              echo "Processing bus message: $base"
              cp "$f" "bus/outbox/$base"
            done
          else
            echo "No pending inbox messages"
          fi

      - name: Record Drive-GitHub unity index
        run: |
          cat > docs/DRIVE_GITHUB_UNITY.md << 'EOF'
          # Drive ↔ GitHub Unity Index
          Numeral: 137451921129154222
          Staging: ENCLAVE-FULL-BACKUP-137451921129154222-2026-09-14
          Catalogs: 4_STAGE_ALPHA_GIG_CATALOG + MULTI_PASS + FULL_SCOPE
          Message bus: bus/
          Participants: github + grok + gemini (file-bus)
          EOF

      - name: Commit cycle state
        run: |
          git config user.name "continuity-engine"
          git config user.email "continuity@users.noreply.github.com"
          git add bus/ docs/ledgers/ docs/DRIVE_GITHUB_UNITY.md || true
          git diff --cached --quiet || git commit -m "chore(unified-cycle): scan+bus pulse ${{ github.run_id }}"
          git push || true
